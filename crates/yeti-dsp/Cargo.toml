[package]
name = "yeti-dsp"
description = "Yeti Studio voice chain: HPF, noise suppression (DeepFilterNet/RNNoise), gate, EQ/de-esser, auto-level, limiter, AEC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["dfn"]
# DeepFilterNet via libDF + tract (verified by the Phase 0 spike, spikes/dfn_spike).
dfn = ["dep:log", "dep:deep_filter", "dep:ndarray", "dep:tract-core", "dep:tract-onnx", "dep:tract-pulse", "dep:tract-hir"]
# WebRTC echo cancellation (Meeting). Needs meson+ninja + C++ toolchain. OFF for Windows
# until built on real Windows. Phase 4 (DSP engineer) adds the webrtc-audio-processing dep here.
aec = []

[dependencies]
yeti-types = { workspace = true }
log = { workspace = true, optional = true }
deep_filter = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
# Exact pins only (not used directly): force tract to the version libDF compiles against.
tract-core = { workspace = true, optional = true }
tract-onnx = { workspace = true, optional = true }
tract-pulse = { workspace = true, optional = true }
tract-hir = { workspace = true, optional = true }

[lints]
workspace = true
