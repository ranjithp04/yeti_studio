[package]
name = "yeti-device"
description = "Blue Yeti discovery and hardware control (gain, mute, headphone volume, sample rate, hot-plug)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
yeti-types = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { workspace = true }
# Phase 1 likely adds: objc2-core-audio-types, objc2-core-foundation (pinned in workspace).

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
] }

[lints]
workspace = true
