[package]
name = "yeti-app"
description = "Yeti Studio desktop app (eframe): Simple / Pro / Mini views, tray, hotkeys, theme, config."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "yeti-studio"
path = "src/main.rs"

[lib]
name = "yeti_app"
path = "src/lib.rs"

[features]
default = ["dfn", "aec"]
dfn = ["yeti-engine/dfn"]
aec = ["yeti-engine/aec"]

[dependencies]
yeti-types = { workspace = true }
yeti-engine = { workspace = true, default-features = false }
env_logger = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }
eframe = { workspace = true }
tray-icon = { workspace = true }
global-hotkey = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true }

[lints]
workspace = true
