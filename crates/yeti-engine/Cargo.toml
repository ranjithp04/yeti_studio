[package]
name = "yeti-engine"
description = "Yeti Studio audio engine: capture → DSP → virtual mic, meters, latency/CPU, device events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["dfn"]
dfn = ["yeti-dsp/dfn"]
aec = ["yeti-dsp/aec"]

[dependencies]
yeti-types = { workspace = true }
yeti-device = { workspace = true }
yeti-dsp = { workspace = true, default-features = false }

[lints]
workspace = true
